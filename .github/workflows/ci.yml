name: CI

# Every course builds against this repository's main branch, so main must always
# be able to validate, test and build the demo course.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate the demo course
        run: npm run validate -- --strict

      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build the demo course
        run: npm run build
